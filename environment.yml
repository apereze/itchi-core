name: itchi

channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================
  # Python
  # ============================================================
  - python=3.11

  # ============================================================
  # Core scientific stack
  # ============================================================
  - numpy
  - pandas
  - scipy
  - xarray
  - dask
  - bottleneck

  # ============================================================
  # NetCDF / Zarr / scientific data formats
  # ============================================================
  - netcdf4
  - h5netcdf
  - zarr

  # ============================================================
  # Geospatial stack
  # ============================================================
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - cartopy

  # ============================================================
  # Plotting and diagnostics
  # ============================================================
  - matplotlib

  # ============================================================
  # Utilities
  # ============================================================
  - pyyaml
  - tqdm

  # ============================================================
  # Jupyter
  # ============================================================
  - jupyterlab
  - notebook
  - ipykernel

  # ============================================================
  # Testing and formatting
  # ============================================================
  - pytest
  - black
  - isort
  - ruff
  - pre-commit

  # ============================================================
  # Pip-only packages, if needed later
  # ============================================================
  - pip
