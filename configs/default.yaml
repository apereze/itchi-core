# ============================================================
# ITCHI Core Configuration
# Integrated Tropical Cyclone Hazard Index
#
# Current scheme (since v0.2.2):
# - precipitation: P6 x (R24, A72) matrix, maximum at the 6-h P95;
# - wind: absolute hazard homologated with Saffir-Simpson, tail cut at 12 m/s;
# - attribution radius: ROCLOUD with R_W06 as a floor by quadrant.
#
# pipeline.compute_itchi_snapshot has these values as keyword defaults;
# itchi.config.itchi_settings_from_config() turns this file (or an overlay
# under configs/experiments/) into those keyword arguments, and
# tests/test_pipeline.py checks that both stay equal.
# ============================================================

project:
  name: "itchi-core"
  version: "0.3.0"
  description: "Core computational workflow for ITCHI"


# ============================================================
# Spatial domain
# ============================================================

domain:
  name: "mexico"
  spatial_resolution_deg: 0.1

  # Domain of the MSWEP percentiles (Mexico and surrounding basins)
  lon_min: -140.0
  lon_max: -60.0
  lat_min: 5.0
  lat_max: 35.0


# ============================================================
# Time
# ============================================================

time:
  # ITCHI is evaluated at tropical-cyclone synoptic times
  synoptic_hours_utc: [0, 6, 12, 18]

  # P6 = (T-6h, T]; R24 = (T-24h, T]; exclusive antecedent A72 = (T-78h, T-6h]
  precipitation_window: "(T-6h, T]"


# ============================================================
# Precipitation (MSWEP V3, May-November, 2000-2024)
# ============================================================

precipitation:
  source: "mswep_v3"
  accumulations_dir: "D:/MSWEP_V316_6H"     # mswep_v3_6h_AAAA.nc
  variable_name: "precipitation"

  # P6 x (R24, A72) matrix (precipitation.PRECIP_MATRIX):
  # maximum at the 6-h P95; the escalation acts only on the P6 node below the
  # maximum (P90 -> 0.8 with R24 >= P95 of 24 h and A72 >= P75 of 72 h).
  matrix:
    p6_nodes: ["Q75", "Q90", "Q95"]
    base: [0.0, 0.0, 0.25, 1.0]       # H_P at (0 mm, Q75, Q90, Q95)
    escalated: [0.0, 0.0, 0.8, 1.0]   # full escalation: P90 -> 0.8
    escalation:                       # weight 0 at start -> 1 at end (own percentiles; "0" = 0 mm)
      R24: ["Q90", "Q95"]
      A72: ["0", "Q75"]
    combine: "all"                    # "all": product of weights; "any": maximum
    # H_P where P6 or a used 6-h percentile is NaN (outside MSWEP or without
    # climatology): 0.0 = no precipitation hazard; null keeps NaN.
    nan_hazard_value: 0.0

  # Local percentiles of 6, 24 and 72 h (wet windows, without the
  # sufficiency filter: p_wet_raw)
  climatology_6h: "data/processed/mswep_v3_6h_percentiles_may_nov.nc"
  climatology_24h: "data/processed/mswep_v3_24h_percentiles_may_nov.nc"
  climatology_72h: "data/processed/mswep_v3_72h_percentiles_may_nov.nc"
  climatology_variable: "p_wet_raw"


# ============================================================
# Cyclone geometry
# ============================================================

geometry:
  distance_units: "km"
  quadrant_convention: ["RNE", "RSE", "RSW", "RNW"]
  # Filling of missing R34 quadrants (and of ROCLOUD with mode "never")
  radius_fill_strategy: "mean_available"


# ============================================================
# Wind hazard
# ============================================================

wind:
  # Absolute hazard homologated with Saffir-Simpson (wind.normalize_wind_hazard_absolute),
  # local wind of the W06 profile calibrated to R34, by quadrant.
  # End of the tail below 34 kt (m/s, 12.0 = 23.3 kt); give at most one of
  # the two. The tail never extends beyond R_W06_q.
  tail_end_wind_kt: null
  tail_end_wind_ms: 12.0
  # SIAT-style classes of 0.2: tail -> 1, TS (34-63) -> 2,
  # moderate H1 (64-82) -> 3, high H2 (83-95) -> 4, maximum >= H3 (>= 96) -> 5;
  # H_W = 1 from 137 kt (H5). Thresholds: NHC Saffir-Simpson Hurricane Wind
  # Scale (1-min sustained wind), https://www.nhc.noaa.gov/aboutsshws.php.
  saffir_simpson_nodes:
    - [34.0, 0.2]
    - [64.0, 0.4]
    - [83.0, 0.6]
    - [96.0, 0.8]
    - [137.0, 1.0]


# ============================================================
# ITCHI weights
# ============================================================

itchi:
  alpha_wind: 1.0
  beta_precip_direct: 1.0
  lambda_direct: 1.0
  mu_indirect: 1.0


# ============================================================
# Parametric radii (Willoughby et al. 2006; Pérez-Alarcón et al. 2021)
# ============================================================

parametric_radii:
  # Role of R_W06 in the attribution radius, by quadrant:
  #   "floor"    R_W06 where ROCLOUD is missing (or 0) or smaller (default)
  #   "fallback" R_W06 only where ROCLOUD is missing
  #   "always"   R_W06 everywhere
  #   "never"    ROCLOUD only; missing quadrants filled with the valid ones
  attribution_radius_mode: "floor"

  # Use the parametric R34 as direct-radius fallback when observed R34 is missing
  use_as_direct_fallback: true

  # R_W06: radius where the W06 profile falls to outer_threshold_ms, PA21
  # configuration (empirical Rmax, no R34 calibration)
  r_w06:
    rmax_variant: "pa21"
    use_observed_rmw: false
    calibrate_to_r34: false
    outer_threshold_ms: 2.0


# ============================================================
# Paths
# ============================================================

paths:
  tracks: "data/raw/tracks/"
  rocloud: "data/external/Rocloud/"
  municipalities: "data/external/mun23gw/mun23gw.shp"
  declaratorias: "outputs/diagnostics/declaratorias_6h/declaratorias_ct_eventos.csv"

outputs:
  cases: "outputs/diagnostics/casos/"
  diagnostics: "outputs/diagnostics/"
  figures: "outputs/figures/"
