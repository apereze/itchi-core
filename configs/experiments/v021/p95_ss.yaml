# Avance v0.2.1, combinación de las dos propuestas: máximo de lluvia en P95 y
# viento Saffir-Simpson con cola cortada en 12 m/s. Se usa en el caso 3.
experiment:
  name: "v021_p95_ss"
  description: "máximo de lluvia en P95; cola cortada en 12 m/s; viento Saffir-Simpson"

precipitation:
  matrix_v02:
    p6_nodes: ["Q75", "Q90", "Q95"]
    base: [0.0, 0.0, 0.25, 1.0]        # H_P en (0 mm, P75, P90, P95)
    escalated: [0.0, 0.0, 0.8, 1.0]    # con suelo saturado, P90 -> 0.8

wind:
  tail_end_wind_ms: 12.0
  hazard_scale: "saffir_simpson"
